[project]
name = "fashion-retrieval"
version = "1.0.0"
description = "Multimodal Fashion & Context Retrieval Engine — region-level FashionCLIP + scene vectors + VLM attribute extraction with structural compositionality"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
